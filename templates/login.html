{% extends "account.html" %}
{% block content %}
<div class="column is-4 is-offset-4">
 <h3 class="title">Login to TAME</h3>
 <div class="box">
  {% with messages = get_flashed_messages() %}
   {% if messages %}
    <div>
     {{ messages[0] }}
    </div>
   {% endif %}
  {% endwith %}
  <form id="loginForm" method="POST" action="/login">
   <div class="field">
    <div class="control">
     <input class="input is-large" type="username" name="username" placeholder="Username" autofocus="">
    </div>
   </div>
   <div class="field">
    <div class="control">
     <input id="password" class="input is-large" type="password" name="password" placeholder="Password">
    </div>
   </div>
   <div class="field">
    <label class="checkbox">
      <input type="checkbox" name="remember">
      Remember me
    </label>
   </div>
   <button class="button is-block is-info is-large is-fullwidth">
    Login
   </button>
  </form>
 </div>
</div>
{% endblock content %}
